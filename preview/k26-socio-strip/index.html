<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K26 preview</title><style>body{margin:0}.chart{width:100%;box-sizing:border-box}.chart {

  &{

    --blue:#2171B5; --red:#CB181D; --grey:#B5B8BD;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  &{font-family:Heebo,system-ui,sans-serif;color:var(--ink);background:#fff;padding:14px 18px 26px}

  .sub{font-size:13px;color:var(--muted);margin-top:2px}

  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:12px 0 8px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:#fff;color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;
              padding:5px 14px;cursor:pointer}
  .seg button.on{background:#111827;color:#fff}
  .seglabel{font-size:12.5px;color:var(--muted)}
  .sliderbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .sliderbox input[type=range]{direction:ltr}
  .sliderbox input{accent-color:#111827;width:150px}
  .backbtn{display:none;border:1px solid var(--line);border-radius:9px;background:#fff;font-family:inherit;
           font-size:13px;font-weight:500;padding:5px 14px;cursor:pointer;color:var(--ink)}
  .backbtn.show{display:inline-block}
  .filternote{display:none;font-size:12px;color:var(--muted)}
  .filternote.show{display:inline}
  .legend{display:flex;flex-wrap:wrap;align-items:center;gap:14px;font-size:12.5px;color:var(--muted);margin:0 0 8px}
  .legend .it{display:flex;align-items:center;gap:6px}
  .dotk{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid #fff;box-shadow:0 0 0 1px #d1d5db}
  .szl{display:inline-block;border-radius:50%;background:#9ca3af;opacity:.55;vertical-align:middle}
  .dashline{display:inline-block;width:26px;border-top:2px dashed #6b7280;vertical-align:middle}
  .solline{display:inline-block;width:26px;border-top:3px solid #111827;vertical-align:middle;border-radius:2px}
  .ramp{display:inline-block;width:120px;height:10px;border-radius:3px;direction:ltr}
  .densg{display:inline-block;width:26px;height:10px;border-radius:2px;border:1px solid #d1d5db;background:linear-gradient(90deg,#fff,#111827);direction:ltr;vertical-align:middle}

  .switcher{display:none;gap:6px;overflow-x:auto;padding:2px 2px 8px}
  .switcher button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 7px;display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--muted);font-size:11px;font-family:inherit}
  .switcher button .plet{filter:grayscale(1);opacity:.55;font-size:11px;min-width:22px;padding:1px 5px}
  .strip{display:flex;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
  .rail{position:sticky;left:0;order:1;z-index:5;background:#fff;flex:0 0 42px;border-right:1px solid var(--line)}
  &[dir=ltr] .rail{order:0}
  .rail .ylab{position:absolute;right:5px;font-size:10.5px;color:var(--muted);transform:translateY(-50%);background:#fff;padding:0 2px}
  .rail .ytitle{position:absolute;top:4px;inset-inline:0;text-align:center;font-size:10.5px;color:var(--muted)}

  .panel:last-child{border-inline-end:none}
  .panel.focus{flex:1 0 44%;min-width:340px}
  .panel.dim{flex:0 0 52px;min-width:52px}
  .panel.dim .pstats{display:none}
  .panel.dim .plotwrap{display:none}
  .panel.dim .xaxis{display:none}
  .panel.dim .phead{border-bottom:none;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding-top:10px}
  .panel.dim .phead:hover{background:#f8f9fb}
  .panel.dim .pname{font-size:10px;color:var(--muted);writing-mode:vertical-rl;text-orientation:mixed;min-height:0}
  .panel.dim .plet{min-width:26px;font-size:12px;padding:1px 5px;filter:grayscale(1);opacity:.55}
  .phead{padding:8px 6px 6px;text-align:center;border-bottom:1px solid var(--line);cursor:pointer}
  .histwrap{margin:6px 2px 0}
  .hist{position:relative;display:flex;align-items:flex-end;gap:1px;height:32px;direction:ltr}
  .hist .hbar{flex:1 1 0;min-width:0;border-radius:1px 1px 0 0;opacity:.85}
  .hist .histavg{position:absolute;top:0;bottom:0;width:2px;background:#1f2937;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(255,255,255,.75);pointer-events:none}

  .histl{position:relative;height:12px;direction:ltr;font-size:9px;color:var(--muted);margin-top:2px}
  .histl span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .panel.focus .hist{height:32px}
  .panel.dim .histwrap{display:none}
  .legend .hkey{display:inline-flex;align-items:flex-end;gap:1px;direction:ltr;vertical-align:middle}

  .pname{font-size:12px;font-weight:500;margin-top:3px;line-height:1.15;min-height:28px;display:flex;align-items:center;justify-content:center}
  .pstats{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .plotwrap{position:relative;padding:0 4px}
  canvas.plot{display:block;width:100%;cursor:crosshair}
  .xaxis{direction:ltr;display:flex;justify-content:space-between;flex:0 0 26px;font-size:10px;color:var(--muted);padding:2px 6px 10px}
  footer{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:10px}
  #tip{position:fixed;display:none;z-index:60;pointer-events:none;background:#111827;color:#f9fafb;
       font-size:12px;line-height:1.5;padding:7px 10px;border-radius:8px;max-width:230px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #imodal{position:fixed;inset:0;display:none;z-index:70;background:rgba(17,24,39,.45);align-items:center;justify-content:center;padding:18px}
  #imodal.open{display:flex}
  #imodal .card{background:#fff;border-radius:12px;max-width:720px;max-height:85vh;overflow-y:auto;padding:18px 20px;font-size:13.5px;line-height:1.7;position:relative}
  #imodal .x{position:absolute;top:10px;inset-inline-end:12px;border:1px solid var(--line);background:#fff;border-radius:8px;
             font-size:13px;padding:2px 10px;cursor:pointer;color:var(--muted)}
  #imodal b{font-weight:700}
  @media (max-width:640px){
    &{padding:10px 8px 20px}
    h1{font-size:17px}
    .panel{flex-basis:92px;min-width:92px}
    .panel.focus{min-width:0;flex:1 1 auto}
    .panel.dim{display:none}
    .switcher.on{display:flex}
  }

}
.chart .coverage-note{font-size:8.5px;line-height:1.25;display:block;margin-top:2px}
.chart header>div{flex:1;min-width:0}
.chart header>.seg{flex-shrink:0}
.chart .legend .it{display:block;max-width:100%;overflow-wrap:anywhere}
.chart .legend .it>span{vertical-align:middle;margin-inline-end:5px}
.chart .phead{display:flex;flex-direction:column;align-items:stretch}
.chart .phead>.plet{align-self:center}
.chart .histwrap{margin-top:auto;padding-top:6px}

.chart .coverage-note{min-height:12px}

.chart .party-logo{display:flex;align-self:center;align-items:center;justify-content:center;width:64px;height:36px}
.chart .party-logo img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.chart .switcher .party-logo{width:32px;height:20px;filter:grayscale(1);opacity:.65}
.chart .panel.dim .party-logo{width:36px;height:28px;filter:grayscale(1);opacity:.65}
.chart .party-logo img{filter:brightness(0);opacity:.85}

.chart [hidden]{display:none!important}

.chart .bloc-control{display:inline-flex;flex-wrap:nowrap;align-items:center;gap:8px}

.chart .party-logo{position:relative;padding-bottom:6px;margin-bottom:1px}
.chart .party-logo::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:1px;background:var(--bloc-color)}

.chart h1{font-size:17px;line-height:1.3}.chart .sub{display:none}.chart .controls{margin-top:8px}.chart .legend{gap:8px 14px;font-size:11.5px}@media(max-width:640px){.chart h1{font-size:16px}}

.chart .ramp{display:inline-flex;overflow:hidden;flex-shrink:0}.chart .ramp i{display:block;height:100%}
</style></head><body><div class="chart" dir="rtl">

E\u05E7\u05D5\u05D5\u05E7\u05D5 \u05D4\u05D5\u05D0 \u05DE\u05DE\u05D5\u05E6\u05E2 \u05DB\u05DC \u05D4\u05DE\u05E6\u05D1\u05D9\u05E2\u05D9\u05DD (5.09). \u05E6\u05D1\u05E2 \u05D4\u05E0\u05E7\u05D5\u05D3\u05D4 \u05D4\u05D5\u05D0 \u05E6\u05D1\u05E2 \u05D4\u05E7\u05DC\u05E4\u05D9 \u05D1\u05DE\u05E4\u05D4: \u05D0\u05D7\u05D5\u05D6 \u05D4\u05E7\u05D5\u05DC\u05D5\u05EA \u05DC\u05D2\u05D5\u05E9 \u05E0\u05EA\u05E0\u05D9\u05D4\u05D5 \u05D1\u05D7\u05DE\u05E9 \u05DE\u05D3\u05E8\u05D2\u05D5\u05EA \u05D0\u05D3\u05D5\u05DD-\u05E1\u05D2\u05D5\u05DC-\u05DB\u05D7\u05D5\u05DC (\u05D2\u05D1\u05D5\u05DC\u05D5\u05EA: 0, 30, 45, 55, 85, 100 \u05D0\u05D7\u05D5\u05D6\u05D9\u05DD), \u05D5\u05D9\u05E8\u05D5\u05E7 \u05DC\u05E7\u05DC\u05E4\u05D9 \u05E9\u05D1\u05D4 \u05DE\u05E2\u05DC 80% \u05DE\u05D4\u05DB\u05E9\u05E8\u05D9\u05DD \u05DC\u05DE\u05E4\u05DC\u05D2\u05D5\u05EA \u05D4\u05E2\u05E8\u05D1\u05D9\u05D5\u05EA, \u05D0\u05D5 \u05D0\u05E4\u05D5\u05E8-\u05DB\u05D7\u05DC\u05D7\u05DC \u05DC\u05E7\u05DC\u05E4\u05D9 \u05E9\u05D1\u05D4 \u05DE\u05E2\u05DC 80% \u05DE\u05D4\u05DB\u05E9\u05E8\u05D9\u05DD \u05DC\u05E9\u05F4\u05E1 \u05D5\u05D9\u05D4\u05D3\u05D5\u05EA \u05D4\u05EA\u05D5\u05E8\u05D4. \u05E9\u05E0\u05D9 \u05D4\u05D7\u05E8\u05D9\u05D2\u05D9\u05DD \u05D7\u05DC\u05D9\u05DD \u05DB\u05D0\u05E9\u05E8 \u05D4\u05E2\u05E8\u05D1\u05D9\u05D5\u05EA \u05D1\u05DE\u05E6\u05D1 "\u05D1\u05E0\u05E4\u05E8\u05D3", \u05D2\u05DD \u05D1\u05EA\u05E6\u05D5\u05D2\u05EA \u05DE\u05E4\u05DC\u05D2\u05D5\u05EA; \u05DB\u05E9\u05D4\u05DF \u05DE\u05E9\u05D5\u05DC\u05D1\u05D5\u05EA \u05D4\u05D7\u05E8\u05D9\u05D2\u05D9\u05DD \u05D0\u05D9\u05E0\u05DD \u05D7\u05DC\u05D9\u05DD \u05D5\u05D4\u05DE\u05DB\u05E0\u05D4 \u05D4\u05D5\u05D0 \u05DB\u05DC \u05D4\u05DB\u05E9\u05E8\u05D9\u05DD. \u05D4\u05E1\u05E3 \u05D4\u05D5\u05D0 \u05DE\u05E2\u05DC 80% \u05D1\u05D3\u05D9\u05D5\u05E7, \u05DC\u05D0 80% \u05D5\u05DE\u05E2\u05DC\u05D4. \u05D1\u05EA\u05E6\u05D5\u05D2\u05EA \u05D2\u05D5\u05E9\u05D9\u05DD \u05E0\u05D9\u05EA\u05DF \u05DC\u05D4\u05E4\u05E8\u05D9\u05D3 \u05D0\u05EA \u05E9\u05F4\u05E1 \u05D5\u05D9\u05D4\u05D3\u05D5\u05EA \u05D4\u05EA\u05D5\u05E8\u05D4 \u05DC\u05D2\u05D5\u05E9 \u05D7\u05E8\u05D3\u05D9 \u05D0\u05D5 \u05DC\u05E9\u05DC\u05D1 \u05D0\u05D5\u05EA\u05DF \u05D1\u05D2\u05D5\u05E9 \u05E0\u05EA\u05E0\u05D9\u05D4\u05D5. \u05D0\u05EA \u05D4\u05DE\u05E4\u05DC\u05D2\u05D5\u05EA \u05D4\u05E2\u05E8\u05D1\u05D9\u05D5\u05EA \u05E0\u05D9\u05EA\u05DF \u05DC\u05D4\u05E4\u05E8\u05D9\u05D3 \u05D0\u05D5 \u05DC\u05E9\u05DC\u05D1 \u05D1\u05D2\u05D5\u05E9 \u05D0\u05D9\u05D6\u05E0\u05E7\u05D5\u05D8. \u05D4\u05D2\u05D5\u05E9\u05D9\u05DD \u05D0\u05D9\u05E0\u05DD \u05D7\u05D5\u05E4\u05E4\u05D9\u05DD, \u05D5\u05DB\u05DC \u05E7\u05D5\u05DC \u05D1\u05E2\u05DC \u05DE\u05D3\u05D3 \u05E0\u05E1\u05E4\u05E8 \u05E4\u05E2\u05DD \u05D0\u05D7\u05EA. \u05D4\u05D0\u05D7\u05D5\u05D6 \u05D1\u05DB\u05DC \u05E7\u05DC\u05E4\u05D9 \u05D5\u05D4\u05DE\u05DE\u05D5\u05E6\u05E2 \u05DE\u05D7\u05D5\u05E9\u05D1\u05D9\u05DD \u05DE\u05E1\u05DB\u05D5\u05DE\u05D9 \u05E7\u05D5\u05DC\u05D5\u05EA \u05DE\u05D3\u05D5\u05D9\u05E7\u05D9\u05DD. \u05D1\u05EA\u05E6\u05D5\u05D2\u05EA \u05DE\u05E4\u05DC\u05D2\u05D5\u05EA \u05D4\u05D4\u05D9\u05E1\u05D8\u05D5\u05D2\u05E8\u05DE\u05D5\u05EA \u05D5\u05D4\u05DE\u05D9\u05DC\u05D5\u05D9 \u05D4\u05E9\u05E7\u05D5\u05E3 \u05D0\u05E4\u05D5\u05E8\u05D9\u05DD, \u05D5\u05E7\u05D5 \u05D4\u05DE\u05DE\u05D5\u05E6\u05E2 \u05D0\u05E4\u05D5\u05E8 \u05DB\u05D4\u05D4. \u05E7\u05D5 \u05DE\u05EA\u05D7\u05EA \u05DC\u05E1\u05DE\u05DC \u05D4\u05DE\u05E4\u05DC\u05D2\u05D4 \u05DE\u05E6\u05D9\u05D9\u05DF \u05D0\u05EA \u05D4\u05D2\u05D5\u05E9: \u05D0\u05D9\u05D6\u05E0\u05E7\u05D5\u05D8 \u05D0\u05D3\u05D5\u05DD, \u05E0\u05EA\u05E0\u05D9\u05D4\u05D5 \u05DB\u05D7\u05D5\u05DC, \u05E2\u05E8\u05D1\u05D9\u05D5\u05EA \u05D9\u05E8\u05D5\u05E7 \u05D5\u05D7\u05E8\u05D3\u05D9\u05DD \u05D0\u05E4\u05D5\u05E8-\u05DB\u05D7\u05DC\u05D7\u05DC. \u05D2\u05DD \u05D1\u05EA\u05E6\u05D5\u05D2\u05EA \u05D2\u05D5\u05E9\u05D9\u05DD \u05D4\u05D4\u05D9\u05E1\u05D8\u05D5\u05D2\u05E8\u05DE\u05D5\u05EA \u05D0\u05E4\u05D5\u05E8\u05D5\u05EA \u05D5\u05E7\u05D5\u05D5\u05D9 \u05D4\u05DE\u05DE\u05D5\u05E6\u05E2 \u05D0\u05E4\u05D5\u05E8\u05D9\u05DD \u05DB\u05D4\u05D9\u05DD; \u05D4\u05E1\u05DE\u05DC \u05D1\u05DB\u05D5\u05EA\u05E8\u05EA \u05DE\u05E6\u05D9\u05D9\u05DF \u05D0\u05EA \u05E6\u05D1\u05E2 \u05D4\u05D2\u05D5\u05E9. \u05D4\u05DE\u05D9\u05DC\u05D5\u05D9 \u05D4\u05E9\u05E7\u05D5\u05E3 \u05DE\u05EA\u05D7\u05EA \u05DC\u05DE\u05DE\u05D5\u05E6\u05E2 \u05D4\u05D5\u05D0 \u05D0\u05E4\u05D5\u05E8 \u05E0\u05D9\u05D8\u05E8\u05DC\u05D9 \u05D1\u05E9\u05EA\u05D9 \u05D4\u05EA\u05E6\u05D5\u05D2\u05D5\u05EA. \u05E6\u05D1\u05E2\u05D9 \u05D4\u05E0\u05E7\u05D5\u05D3\u05D5\u05EA \u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD \u05DC\u05EA\u05D0\u05E8 \u05D0\u05EA \u05E9\u05D9\u05D5\u05DA \u05D4\u05E7\u05DC\u05E4\u05D9 \u05D1\u05DE\u05E4\u05D4 \u05D5\u05DC\u05D0 \u05D0\u05EA \u05E6\u05D1\u05E2 \u05D4\u05D2\u05D5\u05E9.<br>
