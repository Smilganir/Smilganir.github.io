    <title>הבחירות לכנסת ה־25</title>
    
    <!-- MapLibre: load before the app module so workers are ready -->
    <script src="/isr-socio-elections/maplibre-gl.js"></script>
    <script src="/isr-socio-elections/runtime-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
<script type="module">
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const st=m=>void 0;
try{
 const man=await (await fetch('manifest.json?'+Date.now())).json();
 const get=async l=>{const ps=await Promise.all(l.map(async n=>{const r=await fetch(n);if(!r.ok)throw new Error(n+' '+r.status);return (await r.text()).replace(/\n$/,'')}));return ps.join('')};
 const css=await get(man.css),js=await get(man.js);
 const [hc,hj]=await Promise.all([sha(css),sha(js)]);
 if(hc!==man.css_sha||hj!==man.js_sha)throw new Error('hash mismatch css:'+(hc===man.css_sha)+' js:'+(hj===man.js_sha)+' len '+js.length+'/'+man.js_len);
 const s=document.createElement('style');s.textContent=css;document.head.appendChild(s);
 const u=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));
 st('');await import(u);
}catch(e){st('הטעינה נכשלה: '+e.message)}
</script>
  </body>
