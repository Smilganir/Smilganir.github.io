const visible=[...document.querySelectorAll('canvas')];const buffers=Array.from({length:6},()=>document.createElement('canvas'));const all=[...visible,...buffers];all.forEach((c,i)=>{c.width=1024;c.height=512;const x=c.getContext('2d');x.fillStyle=`hsl(${i*45} 40% 35%)`;x.fillRect(0,0,1024,512);x.fillStyle='white';x.font='48px sans-serif';x.fillText('Bounded publisher pressure',20,160)});window.qaPressureBuffers=all;let frame=0;function draw(){frame++;for(const c of visible){const x=c.getContext('2d');x.fillStyle='#17222f';x.fillRect(0,320,1024,192);x.fillStyle='#f0c970';x.fillRect((frame*5)%1024,340,180,90)}requestAnimationFrame(draw)}draw();
