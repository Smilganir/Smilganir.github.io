<title>תצוגה מקדימה - תיקון ספירת הערכות כנסת 25 (מחוץ לאוויר)</title>
<script src="https://smilganir.github.io/isr-socio-elections/maplibre-gl.js"></script>
<script src="https://smilganir.github.io/isr-socio-elections/runtime-config.js"></script>
<script>
/* Shared estimate count boundary for K25 and K26 preview. */
(()=>{
 const counts=['right_votes','left_votes','right_votes_no_jl','left_votes_no_jl','bzb','kosher','voted','not_voted'];
 const realFetch=window.fetch.bind(window);
 window.__estimateAudit={areas:0,copiedVotesRemoved:0,geoAreas:0};
 window.fetch=async(...args)=>{
  const response=await realFetch(...args);
  const url=String(args[0] instanceof Request?args[0].url:args[0]);
  if(url.includes('_k24')||!/stat_areas_lookup|statistical_areas_2022_socio_web/.test(url))return response;
  const data=await response.clone().json();
  if(url.includes('stat_areas_lookup')){
   for(const [key,meta] of Object.entries(data)){
    if(!meta.est||!meta.kpi)continue;
    const k=meta.kpi;
    meta.estimateProfile={coalition_pct:k.coalition_pct,left_pct:k.left_pct,turnout_pct:k.turnout_pct,winner:k.winner,parties:(k.parties||[]).map(({code,name,pct,color})=>({code,name,pct,color})),donor:meta.estDonor};
    window.__estimateAudit.areas++;window.__estimateAudit.copiedVotesRemoved+=k.kosher||0;
    for(const field of counts)k[field]=0;
    k.parties=[];k.src='estimate';k.neighborhood='פרופיל משוער בלבד. אין קלפי באזור. לא נספרים כאן קולות או בעלי זכות בחירה. '+(k.neighborhood||'');
   }
   window.__estimateAreas=data;
  }else{
   for(const f of data.features||[]){if(f.properties.EST_HATCH!==1)continue;f.properties.KOSHER_SUM=0;f.properties.VALID_BALLOTS=0;window.__estimateAudit.geoAreas++;}
   window.__estimateGeo=data;
  }
  return new Response(JSON.stringify(data),{status:response.status,headers:response.headers});
 };
})();

</script>
