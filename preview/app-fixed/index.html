<!doctype html>
<html lang="he"><head><meta charset="UTF-8" /><meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="https://smilganir.github.io/isr-socio-elections/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://smilganir.github.io/isr-socio-elections/maplibre-gl.css" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>עותק עם תיקונים - מפת הבחירות (מחוץ לאוויר)</title>
<script>
(function(){var FIX={"3000:1031":"קריית משה, בית וגן (דרום - מזרח)","3000:1032":"קריית משה, בית וגן (צפון - מזרח), מרכז רפואי שערי צדק","6100:315":"קריית נדבורנא, שיכון ג' (הפועל המזרחי ג'), שיכון ההסתדרות","5000:423":"הצפון החדש - החלק הצפוני","5000:113":"רמת אביב, תכנית ל' (צפון)"};
function rep(o,a,b){return JSON.parse(JSON.stringify(o).split(JSON.stringify(a).slice(1,-1)).join(JSON.stringify(b).slice(1,-1)))}
var base=window.fetch.bind(window);
window.fetch=async function(i,n){var r=await base(i,n);var u=typeof i==='string'?i:(i&&i.href)||(i&&i.url)||'';var L=/stat_areas_lookup/.test(u),G=/statistical_areas_2022_socio_web/.test(u);if(!r.ok||(!L&&!G))return r;
try{var d=await r.clone().json();
if(L){for(var k in FIX){var e=d[k];if(e&&e.fullName&&e.fullName!==FIX[k])d[k]=rep(e,e.fullName,FIX[k])}}
else if(d.features){d.features.forEach(function(f){var p=f.properties||{};var k=Number(p.SEMEL_YISHUV)+':'+Number(p.STAT_2022);if(FIX[k]&&p.STAT_AREA_NAME&&p.STAT_AREA_NAME!==FIX[k])f.properties=rep(p,p.STAT_AREA_NAME,FIX[k])})}
return new Response(JSON.stringify(d),{status:r.status,headers:{'content-type':'application/json'}})}catch(x){return r}}})();
</script>
<script src="https://smilganir.github.io/isr-socio-elections/maplibre-gl.js"></script>
<script src="https://smilganir.github.io/isr-socio-elections/runtime-config.js"></script>
</head><body><div id="root"></div><div id="ldr" style="font:14px system-ui;padding:16px">טוען עותק תצוגה מקדימה...</div>
<script type="module">
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const st=m=>document.getElementById('ldr').textContent=m;
try{
 const man=await (await fetch('manifest.json?'+Date.now())).json();
 const get=async l=>{const ps=await Promise.all(l.map(async n=>{const r=await fetch(n);if(!r.ok)throw new Error(n+' '+r.status);return (await r.text()).replace(/\n$/,'')}));return ps.join('')};
 const css=await get(man.css),js=await get(man.js);
 const [hc,hj]=await Promise.all([sha(css),sha(js)]);
 if(hc!==man.css_sha||hj!==man.js_sha)throw new Error('hash mismatch css:'+(hc===man.css_sha)+' js:'+(hj===man.js_sha)+' len '+js.length+'/'+man.js_len);
 const s=document.createElement('style');s.textContent=css;document.head.appendChild(s);
 const u=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));
 st('');await import(u);document.getElementById('ldr').remove();
}catch(e){st('הטעינה נכשלה: '+e.message)}
</script></body></html>
